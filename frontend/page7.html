
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midway Rapid Dine - Payment</title>
  <meta name="theme-color" content="#0d47a1">
  
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      width:100vw;
      display:flex;
      flex-direction:column;
      font-family:'Poppins',sans-serif;
    }

    header{
      display:flex;
      justify-content:center;
      align-items:center;
      height:12vh;
      background-color:#0d47a1;
      padding:0 5%;
      color:white;
      position:relative;
    }

    .logo{
      width:50px;
      height:50px;
      background-color:white;
      border-radius:50%;
      position:absolute;
      left:5%;
      overflow:hidden;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .brand-name{
      font-size:40px;
      font-weight:bold;
    }

    .chatbot-icon{
      width:40px;
      height:40px;
      background-color:white;
      border-radius:50%;
      position:absolute;
      right:20px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .chatbot-icon img{
      width:25px;
      height:25px;
    }

    .main-content{
      background-color:#c3e5f6;
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .content-box{
      background-color:white;
      width:35%;
      min-height:50%;
      border-radius:10px;
      padding:20px;
      box-shadow:0 4px 8px rgba(0,0,0,0.2);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
    }

    .heading{
      font-size:26px;
      font-weight:bold;
      color:#0d47a1;
    }

    .qr-code{
      width:80%;
      display:block;
      margin:0 auto;
    }

    .payment-message{
      font-size:18px;
      color:#0d47a1;
      text-align:center;
    }

    footer{
      height:7vh;
      background-color:#0d47a1;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:14px;
      padding:10px;
    }
  </style>
</head>

<body>

<script>
if(!sessionStorage.getItem("page6Completed")){
  window.location.href="page6.html";
}
</script>

<header>

  <div class="logo">
    <img src="https://res.cloudinary.com/de6ugxmor/image/upload/v1745771069/WhatsApp_Image_2025-04-27_at_20.58.28_1aecb6e6_hp9dzp.jpg">
  </div>

  <div class="brand-name">
    Midway Rapid Dine
  </div>

  <div class="chatbot-icon" onclick="location.href='chatbot.html'">
    <img src="https://img.icons8.com/ios-filled/50/000000/chat.png">
  </div>

</header>

<div class="main-content">

  <div class="content-box">

    <div class="heading">
      Make the Payment
    </div>

    <img src="https://res.cloudinary.com/de6ugxmor/image/upload/v1745867338/WhatsApp_Image_2025-04-29_at_00.36.34_9d2f52b0_e0cxkf.jpg" class="qr-code">

    <div class="payment-message">
      Please scan the QR code to make your payment.
    </div>
      <button onclick="paymentDone()">
          Payment Completed
      </button>
  </div>

</div>

<footer>
  <p>
    Contact us at Gmail: midwayrapiddine@gmail.com | Insta: midwayrapiddine | X: midwaydine
  </p>
</footer>

<script>
  function goToPayment(){

  const selectedHotels=document.querySelectorAll('.checkbox-container:checked');

  if(selectedHotels.length===0){
    alert("Please select a hotel before proceeding to payment.");
    return;
  }

  sessionStorage.setItem("page6Completed","true");

  window.location.href="page7.html";

}

function paymentDone(){

  alert(
    "Order confirmed successfully. Your food will be prepared before arrival."
  );

}
</script>
</body>
</html>
