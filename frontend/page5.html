
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midway Rapid Dine - Order Waiting</title>
  <meta name="theme-color" content="#0d47a1">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      width:100vw;
      display:flex;
      flex-direction:column;
      font-family:'Poppins',sans-serif;
    }

    header{
      display:flex;
      justify-content:center;
      align-items:center;
      height:12vh;
      background-color:#0d47a1;
      padding:0 5%;
      color:white;
      position:relative;
    }

    .logo{
      width:50px;
      height:50px;
      background-color:white;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      position:absolute;
      left:5%;
      overflow:hidden;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:50%;
    }

    .brand-name{
      font-size:40px;
      font-weight:bold;
    }

    .chatbot-icon{
      width:40px;
      height:40px;
      background-color:white;
      border-radius:50%;
      position:absolute;
      right:20px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .chatbot-icon img{
      width:25px;
      height:25px;
    }

    .main-content{
      background-color:#c3e5f6;
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      gap:20px;
    }

    .timer{
      font-size:50px;
      font-weight:bold;
      color:#0d47a1;
    }

    .waiting-message{
      font-size:24px;
      color:#0d47a1;
      font-weight:bold;
    }

    footer{
      height:7vh;
      background-color:#0d47a1;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:14px;
      padding:10px;
    }
  </style>
</head>

<body>

<script>
if(!sessionStorage.getItem("page4Completed")){
  window.location.href="page4.html";
}
</script>

<header>

  <div class="logo">
    <img src="https://res.cloudinary.com/de6ugxmor/image/upload/v1745771069/WhatsApp_Image_2025-04-27_at_20.58.28_1aecb6e6_hp9dzp.jpg">
  </div>

  <div class="brand-name">
    Midway Rapid Dine
  </div>

  <div class="chatbot-icon" onclick="location.href='chatbot.html'">
    <img src="https://img.icons8.com/ios-filled/50/000000/chat.png">
  </div>

</header>

<div class="main-content">

  <div id="timer" class="timer">
    00:29
  </div>

  <div class="waiting-message">
    Wait until your order is accepted by restaurants
  </div>

</div>

<footer>
  <p>
    Contact us at Gmail: midwayrapiddine@gmail.com | Insta: midwayrapiddine | X: midwaydine
  </p>
</footer>

<script>

let countdown=29;

const timerElement=document.getElementById('timer');

function updateTimer(){

  if(countdown>=0){

    let minutes=Math.floor(countdown/60);

    let seconds=countdown%60;

    timerElement.textContent=`${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;

    countdown--;

  }

  if(countdown<0){

    sessionStorage.setItem("page5Completed","true");

    window.location.href='page6.html';

  }

}

setInterval(updateTimer,1000);

</script>

</body>
</html>
